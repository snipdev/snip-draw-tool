<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snip Draw Tool</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="loading-overlay">
    <div class="loading-content">
      <h1>Snip Draw Tool</h1>
      <div class="loading-spinner"></div>
      <p>Starting up...</p>
    </div>
  </div>
  <div id="app">
    <div id="toolbar">
      <div class="tool-group" id="drawing-tools">
        <button class="tool-btn active" data-tool="pointer" title="Pointer / Select (V)">
          <svg viewBox="0 0 24 24" width="20" height="20"><path d="M5 3l2 16 3.5-5.5L16 19l2-2-5.5-5.5L20 8.5 5 3z" fill="currentColor"/><path d="M13 13l5 5" stroke="currentColor" stroke-width="1.5" fill="none"/></svg>
        </button>
        <button class="tool-btn" data-tool="candle" title="Draw Candle (C)">
          <svg viewBox="0 0 24 24" width="20" height="20"><rect x="9" y="5" width="6" height="14" rx="1" fill="currentColor"/><line x1="12" y1="5" x2="12" y2="1" stroke="currentColor" stroke-width="2"/><line x1="12" y1="19" x2="12" y2="23" stroke="currentColor" stroke-width="2"/></svg>
        </button>
        <button class="tool-btn" data-tool="line" title="Draw Line (L)">
          <svg viewBox="0 0 24 24" width="20" height="20"><line x1="4" y1="20" x2="20" y2="4" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/><circle cx="4" cy="20" r="2" fill="currentColor"/><circle cx="20" cy="4" r="2" fill="currentColor"/></svg>
        </button>
        <button class="tool-btn" data-tool="arrow" title="Draw Arrow (A)">
          <svg viewBox="0 0 24 24" width="20" height="20"><line x1="4" y1="20" x2="20" y2="4" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/><polygon points="20,4 9,6 15,12" fill="currentColor"/></svg>
        </button>
        <button class="tool-btn" data-tool="rect" title="Draw Rectangle (R)">
          <svg viewBox="0 0 24 24" width="20" height="20"><rect x="3" y="3" width="18" height="18" rx="2" stroke="currentColor" stroke-width="2.5" fill="none"/><circle cx="3" cy="3" r="2" fill="currentColor"/></svg>
        </button>
        <button class="tool-btn" data-tool="text" title="Add Text (T)">
          <svg viewBox="0 0 24 24" width="20" height="20"><text x="5" y="20" font-size="18" font-weight="bold" fill="currentColor" font-family="serif">T</text><line x1="3" y1="4" x2="21" y2="4" stroke="currentColor" stroke-width="2"/></svg>
        </button>
        <button class="tool-btn" data-tool="pencil" title="Freehand Pencil (P)">
          <svg viewBox="0 0 24 24" width="20" height="20"><path d="M17 3a2.83 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z" fill="currentColor"/><line x1="15" y1="5" x2="19" y2="9" stroke="currentColor" stroke-width="1" opacity="0.5"/><path d="M2 22l7.5-1.5" stroke="#fff" stroke-width="1" fill="none"/></svg>
        </button>
        <div class="separator"></div>
        <button class="tool-btn" data-tool="long" title="Long Position">
          <svg viewBox="0 0 24 24" width="20" height="20"><line x1="3" y1="16" x2="21" y2="16" stroke="currentColor" stroke-width="2"/><polygon points="10,4 4,16 16,16" fill="currentColor"/></svg>
        </button>
        <button class="tool-btn" data-tool="short" title="Short Position">
          <svg viewBox="0 0 24 24" width="20" height="20"><line x1="3" y1="8" x2="21" y2="8" stroke="currentColor" stroke-width="2"/><polygon points="10,20 4,8 16,8" fill="currentColor"/></svg>
        </button>
        <div class="separator"></div>
        <button class="tool-btn" data-tool="eraser" title="Eraser (E)">
          <svg viewBox="0 0 24 24" width="20" height="20"><path d="M16.24 3.56l4.95 4.95c.78.78.78 2.05 0 2.83L12 20.53 2.81 12l9.19-9.19c.78-.78 2.05-.78 2.83 0z" fill="currentColor"/><path d="M12 20.53l4.95-4.95" stroke="#fff" stroke-width="1.5" fill="none"/></svg>
        </button>
      </div>
      <div class="separator"></div>
      <div class="tool-group" id="color-picker">
        <button class="color-swatch active" data-color="#e2e8f0" title="White" style="background:#e2e8f0"></button>
        <button class="color-swatch" data-color="#60a5fa" title="Blue" style="background:#60a5fa"></button>
        <button class="color-swatch" data-color="#ef4444" title="Red" style="background:#ef4444"></button>
        <button class="color-swatch" data-color="#22c55e" title="Green" style="background:#22c55e"></button>
        <button class="color-swatch" data-color="#f59e0b" title="Orange" style="background:#f59e0b"></button>
        <button class="color-swatch" data-color="#eab308" title="Yellow" style="background:#eab308"></button>
        <button class="color-swatch" data-color="#a78bfa" title="Purple" style="background:#a78bfa"></button>
        <button class="color-swatch" data-color="#22d3ee" title="Cyan" style="background:#22d3ee"></button>
        <button class="color-swatch" data-color="#1e293b" title="Ink" style="background:#1e293b"></button>
        <label class="color-swatch custom-color-wrap" id="custom-color-wrap" title="Custom color">
          <input type="color" id="custom-color" value="#60a5fa">
        </label>
      </div>
      <div class="tool-group" id="thickness-group" title="Stroke width">
        <span id="width-label">W</span>
        <input type="range" id="width-slider" min="1" max="6" step="1" value="2" title="Line thickness">
        <span id="width-value">2</span>
      </div>
      <div class="tool-group" id="action-tools">
        <button class="tool-btn" id="undo-btn" title="Undo (Ctrl+Z)">
          <svg viewBox="0 0 24 24" width="20" height="20"><polyline points="1 4 1 10 7 10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="tool-btn" id="redo-btn" title="Redo (Ctrl+Shift+Z)">
          <svg viewBox="0 0 24 24" width="20" height="20"><polyline points="23 4 23 10 17 10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="separator"></div>
        <button class="tool-btn" id="clear-btn" title="Clear All">
          <svg viewBox="0 0 24 24" width="20" height="20"><polyline points="3 6 5 6 21 6" fill="none" stroke="currentColor" stroke-width="2"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" fill="none" stroke="currentColor" stroke-width="2"/></svg>
        </button>
        <button class="tool-btn" id="export-btn" title="Export as PNG">
          <svg viewBox="0 0 24 24" width="20" height="20"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polyline points="7 10 12 15 17 10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="12" y1="15" x2="12" y2="3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="separator"></div>
        <button class="tool-btn" id="theme-btn" title="Toggle Dark/Light Mode">
          <svg viewBox="0 0 24 24" width="20" height="20"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" fill="currentColor"/></svg>
        </button>
      </div>
      <div class="tool-group" id="status-group">
        <span id="tool-status">Pointer</span>
      </div>
    </div>
    <div id="main-area">
      <canvas id="chart-canvas"></canvas>
      <div id="pan-hint">Pan: middle-click / Alt+drag / Space+drag &middot; or drag empty space</div>
      <div id="text-input-overlay" class="hidden">
        <textarea id="text-input" placeholder="Type your text..." rows="3"></textarea>
        <div class="text-input-actions">
          <button id="text-confirm">Add</button>
          <button id="text-cancel">Cancel</button>
        </div>
      </div>
      <div id="confirm-overlay" class="hidden">
        <div class="confirm-box">
          <p id="confirm-message">Clear all elements? This cannot be undone.</p>
          <div class="text-input-actions">
            <button id="confirm-ok" class="danger-btn">Clear All</button>
            <button id="confirm-cancel">Cancel</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="state.js"></script>
  <script src="chart.js"></script>
  <script src="tools.js"></script>
  <script src="app.js"></script>
</body>
</html>
